$schema: https://azuremlschemas.azureedge.net/latest/environment.schema.json

name: yolo-pipeline-env

description: >
  Shared environment for every step of the board and price-region
  weekly training pipelines: dataset prep with albumentations,
  YOLO fine-tuning, evaluation, and int8 TFLite export.

# A build context, not `image:` + `conda_file:`.
#
# ./Dockerfile installs the X libraries the OpenCV wheels link against and
# forces the headless build to own cv2/ -- neither of which the conda_file
# form can express, since it gives no hook to run apt. See the header comment
# in ./Dockerfile for the failure that made this necessary.
#
# The base image is now the FROM line in ./Dockerfile. preflight asserts it
# agrees with BASE_IMAGE in scripts/create_environment.py.
build:
  path: .
  dockerfile_path: Dockerfile

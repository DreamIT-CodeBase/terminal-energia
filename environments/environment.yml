$schema: https://azuremlschemas.azureedge.net/latest/environment.schema.json

name: yolo-pipeline-env

description: >
  Shared environment for every step of the board and price-region
  weekly training pipelines: dataset prep with albumentations,
  YOLO fine-tuning, evaluation, and int8 TFLite export.

# CPU base image, matching the compute. Nothing in these pipelines needs
# CUDA, and the CUDA variant is a much larger pull for no benefit. If a GPU
# compute is added later, switch to
# openmpi4.1.0-cuda11.8-cudnn8-ubuntu22.04 AND drop the `+cpu` torch pins in
# conda.yml -- the image alone is not enough.
image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04

conda_file: ./conda.yml
